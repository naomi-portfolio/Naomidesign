  <style>
    /* ── 密碼畫面 ── */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--color-bg, #0a0a0a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2rem;
    }
    #lock-screen .lock-inner {
      width: min(420px, 90vw);
      text-align: center;
    }
    #lock-screen .lock-icon {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }
    #lock-screen h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--color-text, #e8e8e8);
      margin-bottom: 0.5rem;
    }
    #lock-screen p {
      font-size: 0.85rem;
      color: var(--color-text-muted, #666);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }
    #lock-screen .pw-field {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    #lock-screen input[type="password"] {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--color-text, #e8e8e8);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #lock-screen input[type="password"]:focus {
      border-color: var(--color-accent, #00d4a3);
    }
    #lock-screen button {
      padding: 0.75rem 1.5rem;
      background: var(--color-accent, #00d4a3);
      color: #000;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    #lock-screen button:hover { opacity: 0.85; }
    #lock-screen .pw-error {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #e05;
      min-height: 1.2em;
      letter-spacing: 0.03em;
    }

    /* ── 頁面隱藏時 ── */
    body.locked .navbar,
    body.locked #page-content {
      visibility: hidden;
    }
    body.unlocked #lock-screen {
      display: none;
    }
  </style>
</head>

        <button id="pw-btn">進入</button>
      </div>
      <div class="pw-error" id="pw-error"></div>
    </div>
  </div>

  <div class="scroll-progress"></div>

    <!-- 1. 頁首 -->

  <script src="https://unpkg.com/lenis@1.3.21/dist/lenis.min.js"></script>
  <script src="js/common.js"></script>

  <script src="js/particles.js"></script>

  <script>
    // ── 密碼驗證 ──
    const CORRECT_PW = 'gengyu0824';
    const SESSION_KEY = 'food_portfolio_unlocked';

    function unlock() {
      document.body.classList.remove('locked');
      document.body.classList.add('unlocked');
      sessionStorage.setItem(SESSION_KEY, '1');
      updateCount();
    }

    function tryUnlock() {
      const val = document.getElementById('pw-input').value;
      if (val === CORRECT_PW) {
        unlock();
      } else {
        const err = document.getElementById('pw-error');
        err.textContent = '密碼錯誤，請再試一次。';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
        setTimeout(() => { err.textContent = ''; }, 3000);
      }
    }

    document.getElementById('pw-btn').addEventListener('click', tryUnlock);
    document.getElementById('pw-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryUnlock();
    });

    // 同一 session 內已解鎖則直接顯示
    if (sessionStorage.getItem(SESSION_KEY) === '1') unlock();

    // 更新作品數量
    function updateCount() {
      const cards = document.querySelectorAll('#food-grid .work-card');
      document.getElementById('food-count').textContent = cards.length;
    }

    // 篩選器
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('#food-grid .work-card').forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  </script>
