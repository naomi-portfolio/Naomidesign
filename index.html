<!-- 背景：跟著你正在看的東西慢慢換 -->
<div class="bg" id="bg" aria-hidden="true"><img alt=""><img alt=""><div class="motes" id="motes"></div></div>

<header class="top">
  <a class="logo" id="home" href="./" aria-label="回到第一頁">Naomi<i>.</i></a>
  <button class="back" id="back" aria-label="上一頁" hidden>←<span> 上一頁</span></button>

<main>
  <section class="layer" data-layer="0" aria-label="選擇需求">
    <div class="inner l0">
      <div class="say">
        <span class="mono">接案中 · Made in Taipei</span>
        <h1>我想<em id="blank"></em></h1>
        <div class="pick"><button id="prevN" aria-label="上一個">↑</button><span class="mono" id="nOf" aria-live="polite"></span><button id="nextN" aria-label="下一個">↓</button></div>
      </div>
      <ol class="opts" id="opts"></ol>
    </div>
  </section>
  <section class="layer" data-layer="1" aria-label="相關作品"><div class="inner l1" id="L1"></div></section>
  <section class="layer" data-layer="2" aria-label="案例"><div class="inner l2" id="L2"></div></section>
  <section class="layer" data-layer="3" aria-label="委託"><div class="inner l3" id="L3"></div></section>
</main>

<div class="player">
  <div class="player-frame" id="pframe" hidden></div>
  <div class="player-bar">
    <button class="pbtn main" id="pplay" aria-label="播放">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path id="picon" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>
    </button>
    <div class="pmeta"><span class="mono">Naomi 的原創音樂</span><b id="ptitle"></b></div>
    <button class="pbtn" id="pnext" aria-label="下一首">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1.5v11l7-5.5zM10.5 1.5h1.8v11h-1.8z" fill="currentColor"/></svg>
    </button>
  </div>
  <label class="pvol">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5h2.5L7 2v10L3.5 9H1z" fill="currentColor"/><path d="M9.2 4.6c1 .7 1.5 1.5 1.5 2.4s-.5 1.700-1.500 2.400" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <input type="range" id="pvol" min="0" max="100" step="1" aria-label="音量">
  </label>
</div>

<!-- 兔兔：可以拖到任何地方放著 -->
